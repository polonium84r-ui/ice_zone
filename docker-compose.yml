services:
  db:
    image: postgres:16-alpine
    container_name: thirst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thirst
      POSTGRES_PASSWORD: thirst
      POSTGRES_DB: thirst
    ports:
      - "5432:5432"
    volumes:
      - thirst_pgdata:/var/lib/postgresql/data

volumes:
  thirst_pgdata:
