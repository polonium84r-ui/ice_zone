<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/thirst-logo.png">
  <meta name="description" content="Thirst. staff & admin sign in">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff & Admin Login — Thirst.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page-body">
  <div class="auth-page">
    <!-- Left Image Panel -->
    <div class="auth-image">
      <img src="assets/hero.jpg" alt="Handcrafted hot chocolate and desserts">
      <div class="auth-image-overlay">
        <div>
          <h2>Thirst. Console</h2>
          <p style="margin-top:12px;opacity:0.9">Sign in to manage the menu, run billing, and view your store.</p>
        </div>
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-card">
        <img src="assets/thirst-logo.png" alt="Thirst." class="auth-logo-img">
        <h1>Staff &amp; Admin</h1>
        <p class="subtitle">Sign in to your Thirst. account</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" data-validate="email" required placeholder="you@thirst.in" autocomplete="username">
            <span class="form-error"></span>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="login-password" class="form-control" data-validate="password" required placeholder="Enter password" autocomplete="current-password">
              <button type="button" class="password-toggle" data-target="login-password">Show</button>
            </div>
            <span class="form-error"></span>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
        </form>

        <p style="text-align:center;margin-top:24px"><a href="index.html" style="color:var(--color-text-muted);font-size:14px">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.init();

      // Where each role lands after signing in.
      function landingFor(role) {
        return role === 'admin' ? 'admin.html' : 'billing.html';
      }

      // Already signed in? Go straight to the console.
      if (Auth.isLoggedIn() && Auth.canStaff()) {
        window.location.href = landingFor(Auth.getUser()?.role);
        return;
      }

      // Password show/hide
      document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.target);
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          btn.textContent = isPassword ? 'Hide' : 'Show';
        });
      });

      const form = document.getElementById('login-form');
      App.setupFieldValidation(form);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email');
        const password = document.getElementById('login-password');
        const valid = App.validateField(email) & App.validateField(password);
        if (!valid) return;

        try {
          const session = await Auth.login(email.value.trim(), password.value);
          // Only staff & admin accounts may sign in.
          if (!Auth.canStaff()) {
            await Auth.logout();
            throw new Error('This account does not have access.');
          }
          App.showToast('Welcome, ' + session.user.name.split(' ')[0] + '!', 'success');
          setTimeout(() => window.location.href = landingFor(session.user.role), 600);
        } catch (err) {
          password.classList.add('error');
          App.showToast(err.message, 'error');
          form.style.animation = 'shake 0.4s ease';
          setTimeout(() => form.style.animation = '', 400);
        }
      });
    });
  </script>
</body>
</html>
