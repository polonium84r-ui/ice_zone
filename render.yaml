services:
  - type: web
    name: ice-zone
    runtime: node
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npx tsx prisma/seed.ts && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thirst-db
          property: connectionString
      - key: THIRST_JWT_SECRET
        generateValue: true

databases:
  - name: thirst-db
    plan: free
