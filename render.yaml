services:
  - type: web
    name: ice-zone
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: THIRST_JWT_SECRET
        sync: false
